name: Build JARVIS Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Web Bundle
        run: npx vite build

      - name: Install Capacitor & Add Android Platform
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          rm -rf android
          npx cap add android

      - name: Configure Android Permissions, Icons & WebView Audio Support
        run: |
          node << 'EOF'
            const fs = require("fs");
            const path = require("path");

            // 1. Update AndroidManifest.xml with Mic, Camera, Audio, Internet, and WhatsApp queries
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let manifest = fs.readFileSync(manifestPath, "utf8");

            const permissions = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />'
            ];

            for (const perm of permissions) {
              if (!manifest.includes(perm)) {
                manifest = manifest.replace("<application", perm + "\n    <application");
              }
            }

            if (!manifest.includes("<queries>")) {
              const queriesBlock = `    <queries>\n        <package android:name="com.whatsapp" />\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="https" />\n        </intent>\n    </queries>\n`;
              manifest = manifest.replace("</manifest>", queriesBlock + "</manifest>");
            }

            fs.writeFileSync(manifestPath, manifest);

            // 2. Copy Arc Reactor PNG icon into Android mipmap launcher folders
            const iconSrc = "public/pwa-512x512.png";
            if (fs.existsSync(iconSrc)) {
              const resDir = "android/app/src/main/res";
              for (const folder of fs.readdirSync(resDir)) {
                if (folder.startsWith("mipmap-")) {
                  const targetDir = path.join(resDir, folder);
                  for (const targetName of ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]) {
                    const dest = path.join(targetDir, targetName);
                    if (fs.existsSync(dest)) {
                      fs.copyFileSync(iconSrc, dest);
                    }
                  }
                }
              }
            }

            // 3. Configure MainActivity.java to request runtime RECORD_AUDIO & CAMERA permissions
            const mainActivityPath = "android/app/src/main/java/com/jarvis/assistant/MainActivity.java";
            const mainActivityCode = `package com.jarvis.assistant;

import android.Manifest;
import android.content.pm.PackageManager;
import android.os.Bundle;
import androidx.core.app.ActivityCompat;
import androidx.core.content.ContextCompat;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
    private static final int PERMISSION_REQUEST_CODE = 1001;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED
            || ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
            ActivityCompat.requestPermissions(
                this,
                new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA},
                PERMISSION_REQUEST_CODE
            );
        }
    }
}
`;
            fs.writeFileSync(mainActivityPath, mainActivityCode);
          EOF

      - name: Sync Web Assets to Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK Artifact
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/JARVIS-AI.apk

      - name: Upload JARVIS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-APK
          path: apk-output/JARVIS-AI.apk
          if-no-files-found: error
          retention-days: 30
