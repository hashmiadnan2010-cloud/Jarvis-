name: Build JARVIS Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Dependencies
        run: npm install

      - name: Build Web Bundle
        run: npx vite build

      - name: Install Capacitor & Add Android Platform
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          rm -rf android
          npx cap add android

      - name: Configure Android Permissions, Icons & WebView Audio Support
        run: node scripts/configure-android.cjs

      - name: Sync Web Assets to Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK Artifact
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/JARVIS-AI.apk

      - name: Upload JARVIS APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: JARVIS-AI-APK
          path: apk-output/JARVIS-AI.apk
          if-no-files-found: error
          retention-days: 30
